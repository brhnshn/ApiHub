    <script>
        (function () {
            var bootErrorShown = false;
            var bootCompleted = false;

            if (typeof window.checkForPwaUpdates !== "function") {
                window.checkForPwaUpdates = function () {
                    return "no-sw";
                };
            }

            window.insertTextAtCursor = function (elementId, beforeTag, afterTag) {
                var el = document.getElementById(elementId);
                if (!el) return "";
                var start = el.selectionStart;
                var end = el.selectionEnd;
                var text = el.value;
                var selected = text.substring(start, end);
                var replacement = beforeTag + selected + afterTag;
                el.value = text.substring(0, start) + replacement + text.substring(end);
                el.focus();
                el.selectionStart = start + beforeTag.length;
                el.selectionEnd = start + beforeTag.length + selected.length;
                return el.value;
            };

            window.setupBottomSheetSwipe = function () {
                var sheet = document.querySelector('.mobile-bottom-sheet');
                var backdrop = document.querySelector('.mobile-sheet-backdrop');
                if (!sheet || !backdrop || sheet.dataset.swipeInitialized === 'true') return;

                sheet.dataset.swipeInitialized = 'true';
                var startY = 0;
                var currentY = 0;
                var isDragging = false;

                sheet.addEventListener('touchstart', function (e) {
                    var touch = e.touches[0];
                    startY = touch.clientY;
                    currentY = startY;
                    isDragging = true;
                    sheet.style.transition = 'none';
                }, { passive: true });

                sheet.addEventListener('touchmove', function (e) {
                    if (!isDragging) return;
                    var touch = e.touches[0];
                    currentY = touch.clientY;
                    var diffY = currentY - startY;

                    if (diffY > 0) {
                        sheet.style.transform = 'translateY(' + diffY + 'px)';
                        var opacity = Math.max(0, 0.4 - (diffY / 500));
                        backdrop.style.backgroundColor = 'rgba(5, 5, 8, ' + opacity + ')';
                    }
                }, { passive: true });

                sheet.addEventListener('touchend', function () {
                    if (!isDragging) return;
                    isDragging = false;
                    var diffY = currentY - startY;

                    backdrop.style.backgroundColor = '';

                    if (diffY > 100) {
                        // Smoothly animate the sheet completely down out of the viewport
                        sheet.style.transition = 'transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1)';
                        sheet.style.transform = 'translateY(100%)';
                        
                        // Click backdrop after the slide down animation completes
                        setTimeout(function () {
                            backdrop.click();
                            // Reset the transform so it opens fully next time
                            sheet.style.transform = '';
                        }, 250);
                    } else {
                        sheet.style.transition = 'transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1)';
                        sheet.style.transform = '';
                    }
                    startY = 0;
                    currentY = 0;
                });
            };

            window.hideLoader = function () {
                bootCompleted = true;
                var fallback = document.getElementById("boot-fallback");
                if (fallback) {
                    fallback.remove();
                }
            };

            function hasBlazorRendered(app, fallback) {
                if (!app) {
                    return false;
                }

                for (var i = 0; i < app.children.length; i++) {
                    if (!fallback || app.children[i] !== fallback) {
                        return true;
                    }
                }

                return false;
            }

            window.showBootError = function (message) {
                if (bootErrorShown) {
                    return;
                }

                bootErrorShown = true;
                var fallback = document.getElementById("boot-fallback");
                if (!fallback) {
                    return;
                }

                fallback.innerHTML =
                    '<div class="boot-card">' +
                    '<div class="boot-title">ApiHub acilamadi</div>' +
                    '<div class="boot-text">Uygulama arayuzu baslatilirken hata olustu.</div>' +
                    '<pre class="boot-error">' + String(message || "Bilinmeyen hata") + '</pre>' +
                    '</div>';
            };

            function isIgnorableBridgeMessage(message) {
                var text = String(message || "").toLowerCase();
                return text.indexOf("blazor has already started") >= 0;
            }

            window.addEventListener("error", function (event) {
                if (isIgnorableBridgeMessage(event.message)) {
                    event.preventDefault();
                    return;
                }

                window.showBootError(event.message || "JavaScript hatasi");
            });

            window.addEventListener("unhandledrejection", function (event) {
                var reason = event.reason && (event.reason.message || event.reason.toString());
                if (isIgnorableBridgeMessage(reason)) {
                    event.preventDefault();
                    return;
                }

                window.showBootError(reason || "Beklenmeyen uygulama hatasi");
            });

            window.setTimeout(function () {
                var fallback = document.getElementById("boot-fallback");
                if (fallback && fallback.style.display !== "none") {
                    var text = fallback.querySelector(".boot-wait-text");
                    if (text) {
                        text.textContent = "Uygulama yukleniyor, lutfen bekleyin...";
                    }
                }
            }, 15000);

            window.setTimeout(function () {
                if (bootCompleted || bootErrorShown) {
                    return;
                }

                var app = document.getElementById("app");
                var fallback = document.getElementById("boot-fallback");
                if (app && hasBlazorRendered(app, fallback)) {
                    window.hideLoader();
                    return;
                }

                window.showBootError("Blazor arayuzu 30 saniye icinde baslatilamadi. APK icindeki istemci paketi veya baslangic servisleri kontrol edilmeli.");
            }, 30000);

            window.addEventListener("DOMContentLoaded", function () {
                var app = document.getElementById("app");
                if (!app || !window.MutationObserver) {
                    return;
                }

                var observer = new MutationObserver(function () {
                    if (bootCompleted || bootErrorShown) {
                        observer.disconnect();
                        return;
                    }

                    var fallback = document.getElementById("boot-fallback");
                    if (hasBlazorRendered(app, fallback)) {
                        window.hideLoader();
                        observer.disconnect();
                    }
                });

                observer.observe(app, { childList: true });
            });
        })();
    </script>

<body>
    <div id="app">
        <div id="boot-fallback" class="boot-shell">
            <div class="boot-logo">
                <span>API</span><strong>HUB</strong>

            <div class="boot-wait-text">Uygulama baslatiliyor...</div>
        </div>
    </div>

            margin-top: 14px;

            border-radius: 12px;

            padding: 20px;
            text-align: left;
            width: min(100%, 520px);

        .boot-title {
            color: #f8fafc;

            font-weight: 800;
            margin-bottom: 8px;
        }

        .boot-text {
            color: #cbd5e1;

            margin-bottom: 12px;
        }

        .boot-error {
            background: #020617;
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.78rem;
            margin: 0;
            overflow: auto;
            padding: 12px;
            white-space: pre-wrap;
        }

        #blazor-error-ui {
            background: #111827;
            border-top: 1px solid rgba(190, 18, 60, 0.5);
            bottom: 0;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.35);
            color: #fca5a5;
            display: none;
            font: 13px Arial, sans-serif;
            left: 0;
            padding: 12px 44px 12px 14px;
            position: fixed;
            right: 0;
            z-index: 100000;
        }

        #blazor-error-ui .reload {
            color: #ffffff;
            font-weight: 700;
            margin-left: 8px;
        }

        #blazor-error-ui .dismiss {
            color: #ffffff;
            cursor: pointer;
            position: absolute;
            right: 14px;
            top: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <div id="blazor-error-ui">
        Uygulama arayuzunde beklenmeyen bir hata olustu.
        <a href="" class="reload">Yeniden yukle</a>
        <a class="dismiss">x</a>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
