    <style>
        @keyframes spin-slow {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        
        @keyframes pulse-soft {
          0%, 100% { opacity: 0.4; }
          50% { opacity: 1; }
        }

        @keyframes neon-glow {
          0%, 100% { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5), 0 0 20px rgba(59, 130, 246, 0.3); }
          50% { text-shadow: 0 0 15px rgba(59, 130, 246, 0.8), 0 0 30px rgba(59, 130, 246, 0.5); }

        .animate-spin-slow {
          animation: spin-slow 3s linear infinite;

            linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
          background-size: 50px 50px;
          pointer-events: none;
        }
        
        /* Vignette effect for depth */
        .vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
          pointer-events: none;

          display: flex;

          align-items: center;

        #app-loading-overlay [data-purpose="logo-wrapper"] {

    <script>
        window.__dockerPanelLoaded = false;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.__dockerPanelLoaded) {
                    return;
                }

                const loader = document.getElementById('app-loading-overlay');
                const app = document.getElementById('app');
                if (loader && app && app.childElementCount > 0) {
                    window.hideLoader();
                }
            }, 8000);
        });

        // Force-clear all cached service worker assets once to load the new assemblies
        if (localStorage.getItem('pwa_cache_cleared_v5') !== 'true') {
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) caches.delete(name);
                }).then(() => {
                    localStorage.setItem('pwa_cache_cleared_v5', 'true');
                    console.log("PWA Cache successfully cleared to prevent NullabilityInfoContext issues.");
                    location.reload();
                });
            } else {
                localStorage.setItem('pwa_cache_cleared_v5', 'true');
            }
        }

        window.hideLoader = () => {
            window.__dockerPanelLoaded = true;
            const loader = document.getElementById('app-loading-overlay');
            if (loader) {
                loader.classList.add('loader-hidden');
                setTimeout(() => {
                    loader.remove();
                }, 650);
            }
        };

        window.checkForPwaUpdates = () => {
            return new Promise(async (resolve) => {
                if (!('serviceWorker' in navigator)) {
                    resolve("not-supported");
                    return;
                }
                try {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    if (regs.length === 0) {
                        resolve("no-sw");
                        return;
                    }

                    const reg = regs[0];

                    // Bekleyen bir güncelleme zaten varsa hemen bildir
                    if (reg.waiting) {
                        resolve("updated");
                        return;
                    }

                    // Yüklenmekte olan güncelleme varsa
                    if (reg.installing) {
                        resolve("installing");
                        return;
                    }

                    // Sunucuya gidip gerçekten yeni sürüm var mı kontrol et
                    await reg.update();

                    // update() sonrası tekrar kontrol et
                    if (reg.waiting) {
                        resolve("updated");
                    } else if (reg.installing) {
                        resolve("installing");
                    } else {
                        resolve("up-to-date");
                    }
                } catch (e) {
                    console.error("PWA update check failed:", e);
                    resolve("error");
                }
            });
        };

        // Only register service worker if we verify this is the panel host
        async function initServiceWorker() {
            if (!('serviceWorker' in navigator)) {
                return;
            }
            const currentHost = window.location.host;
            if (currentHost.startsWith('localhost') || currentHost.startsWith('127.0.0.1')) {
                // Register on localhost for development testing
                registerSW();
                return;
            }
            try {
                let isPanel = false;
                const res = await fetch('/api/system/verify-host?host=' + encodeURIComponent(currentHost));
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.isPanel === true) {
                        isPanel = true;
                    }
                }
                
                if (isPanel) {
                    registerSW();
                } else {
                    await unregisterAllAndReload();
                }
            } catch (e) {
                // If it fails to parse JSON or connection refused (e.g. Node.js project is running on this port),
                // it means this is NOT the panel host. Unregister service worker and reload.
                console.warn("Host verification error - likely a non-panel app running on this port:", e);
                await unregisterAllAndReload();
            }
        }

        function registerSW() {
            navigator.serviceWorker.register('service-worker.js').then(reg => {
                // Eğer bekleyen bir güncelleme varsa hemen göster
                if (reg.waiting) {
                    showUpdateNotification(reg.waiting);
                }

                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    if (newWorker) {
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                showUpdateNotification(newWorker);
                            }
                        });
                    }
                });

                // Aktif olarak her açılışta güncelleme denetimi yap
                reg.update().catch(err => console.log("SW active update check skipped:", err));
            });
        }

        async function unregisterAllAndReload() {
            let cleared = false;
            if ('serviceWorker' in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                for (let reg of regs) {
                    await reg.unregister();
                    cleared = true;
                }
            }
            if ('caches' in window) {
                const keys = await caches.keys();
                for (let key of keys) {
                    await caches.delete(key);
                    cleared = true;
                }
            }
            if (cleared) {
                console.info("Cleared service worker hijacking cache. Reloading...");
                window.location.reload(true);
            }
        }

        initServiceWorker();

        function showUpdateNotification(worker) {
            const toast = document.createElement('div');
            toast.id = 'pwa-update-toast';
            toast.style.cssText = `
                position: fixed;
                bottom: 24px;
                right: 24px;
                left: 24px;
                max-width: 400px;
                margin: 0 auto;
                background: #ffffff;
                border: 1px solid #e2e8f0;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.02);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                color: #0b1c30;
                padding: 16px;
                border-radius: 16px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                z-index: 10000;
                font-family: 'Outfit', sans-serif;
                box-sizing: border-box;
                animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            `;
            
            toast.innerHTML = `
                <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
                    <div style="background: rgba(0, 108, 73, 0.1); border: 1px solid rgba(0, 108, 73, 0.2); color: #006c49; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <i class="fa-solid fa-arrows-rotate" style="font-size: 17px; animation: spin-update 2s linear infinite;"></i>
                    </div>
                    <div style="min-width: 0; text-align: left;">
                        <h4 style="margin: 0; font-size: 14px; font-weight: 800; color: #0b1c30; letter-spacing: 0.3px;">Güncelleme Hazır</h4>
                        <p style="margin: 4px 0 0 0; font-size: 12px; color: #64748b; font-weight: 500; opacity: 0.9;">Yeni sürüm kullanıma hazır</p>
                    </div>
                </div>
                <button id="pwa-update-btn" style="background: #006c49; color: white; border: none; font-weight: 700; font-size: 12px; padding: 9px 18px; border-radius: 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap; box-shadow: 0 4px 12px rgba(0, 108, 73, 0.25); letter-spacing: 0.3px;">
                    Şimdi Yenile
                </button>
            `;
            
            document.body.appendChild(toast);
            
            document.getElementById('pwa-update-btn').addEventListener('click', () => {
                worker.postMessage({ action: 'skipWaiting' });
                location.reload();
            });
        }

        window.insertTextAtCursor = (elementId, beforeTag, afterTag) => {
            const el = document.getElementById(elementId);
            if (!el) return "";
            const start = el.selectionStart;
            const end = el.selectionEnd;
            const text = el.value;
            const selected = text.substring(start, end);
            const replacement = beforeTag + selected + afterTag;
            el.value = text.substring(0, start) + replacement + text.substring(end);
            el.focus();
            el.selectionStart = start + beforeTag.length;
            el.selectionEnd = start + beforeTag.length + selected.length;
            return el.value;
        };

        window.setupBottomSheetSwipe = () => {
            const sheet = document.querySelector('.mobile-bottom-sheet');
            const backdrop = document.querySelector('.mobile-sheet-backdrop');
            if (!sheet || !backdrop || sheet.dataset.swipeInitialized === 'true') return;

            sheet.dataset.swipeInitialized = 'true';
            let startY = 0;
            let currentY = 0;
            let isDragging = false;

            sheet.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                startY = touch.clientY;
                currentY = startY;
                isDragging = true;
                sheet.style.transition = 'none';
            }, { passive: true });

            sheet.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                currentY = touch.clientY;
                const diffY = currentY - startY;

                if (diffY > 0) {
                    sheet.style.transform = `translateY(${diffY}px)`;
                    const opacity = Math.max(0, 0.4 - (diffY / 500));
                    backdrop.style.backgroundColor = `rgba(5, 5, 8, ${opacity})`;
                }
            }, { passive: true });

            sheet.addEventListener('touchend', () => {
                if (!isDragging) return;
                isDragging = false;
                const diffY = currentY - startY;

                backdrop.style.backgroundColor = '';

                if (diffY > 100) {
                    // Smoothly animate the sheet completely down out of the viewport
                    sheet.style.transition = 'transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1)';
                    sheet.style.transform = 'translateY(100%)';
                    
                    // Click backdrop after the slide down animation completes
                    setTimeout(() => {
                        backdrop.click();
                        // Reset the transform so it opens fully next time
                        sheet.style.transform = '';
                    }, 250);
                } else {
                    sheet.style.transition = 'transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1)';
                    sheet.style.transform = '';
                }
                startY = 0;
                currentY = 0;
            });
        };

        window.analyzeZipFile = async (inputFileElement) => {
            if (!inputFileElement || !inputFileElement.files || inputFileElement.files.length === 0) {
                return { success: false, error: "Dosya seçilmedi." };
            }
            const file = inputFileElement.files[0];
            
            // Dynamically load JSZip from CDN if not loaded
            if (typeof window.JSZip === 'undefined') {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const zip = await window.JSZip.loadAsync(arrayBuffer);
                const files = Object.keys(zip.files);
                
                let detectedRuntime = "unknown";
                let detectedName = "";
                let detectedEntryFile = "";
                
                // 1. Detect runtime and project name
                // Node: package.json
                const packageJsonFile = files.find(f => f === "package.json" || f.endsWith("/package.json"));
                if (packageJsonFile) {
                    detectedRuntime = "node";
                    try {
                        const content = await zip.files[packageJsonFile].async("string");
                        const pkg = JSON.parse(content);
                        detectedName = pkg.name || "";
                        detectedEntryFile = pkg.main || "";
                    } catch (e) {}
                    
                    // If no main file specified, check common defaults
                    if (!detectedEntryFile) {
                        const commonEntries = ["index.js", "app.js", "server.js", "main.js"];
                        for (const entry of commonEntries) {
                            if (files.some(f => f === entry || f.endsWith("/" + entry))) {
                                detectedEntryFile = entry;
                                break;
                            }
                        }
                    }
                }
                // Dotnet: csproj or dll / runtimeconfig.json
                else if (files.some(f => f.endsWith(".csproj") || f.endsWith(".sln") || f.endsWith(".runtimeconfig.json"))) {
                    detectedRuntime = "dotnet";
                    const csprojFile = files.find(f => f.endsWith(".csproj"));
                    if (csprojFile) {
                        detectedName = csprojFile.split('/').pop().replace(".csproj", "");
                    } else {
                        const runtimeConfigFile = files.find(f => f.endsWith(".runtimeconfig.json"));
                        if (runtimeConfigFile) {
                            detectedName = runtimeConfigFile.split('/').pop().replace(".runtimeconfig.json", "");
                        }
                    }
                    
                    // Find main runnable DLL if any
                    const dllFile = files.find(f => f.endsWith(".dll") && !f.includes("System.") && !f.includes("Microsoft."));
                    if (dllFile) {
                        detectedEntryFile = dllFile.split('/').pop();
                    }
                }
                // Python: requirements.txt, manage.py, app.py, main.py
                else if (files.some(f => f === "requirements.txt" || f.endsWith("/requirements.txt") || f.endsWith("manage.py") || f.endsWith("app.py") || f.endsWith("main.py"))) {
                    detectedRuntime = "python";
                    const mainPy = files.find(f => f.endsWith("app.py") || f.endsWith("main.py") || f.endsWith("manage.py"));
                    if (mainPy) {
                        detectedName = mainPy.split('/').pop().replace(".py", "");
                        detectedEntryFile = mainPy.split('/').pop();
                    }
                }
                // Static: index.html, index.htm, index.php
                else if (files.some(f => f.endsWith("index.html") || f.endsWith("index.htm") || f.endsWith("index.php"))) {
                    detectedRuntime = "static";
                }
                
                return {
                    success: true,
                    detectedRuntime: detectedRuntime,
                    detectedName: detectedName,
                    detectedEntryFile: detectedEntryFile,
                    fileName: file.name,
                    fileSize: file.size
                };
            } catch (err) {
                return { success: false, error: err.message };
            }
        };
    </script>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
            to { transform: rotate(-360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(80px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes spin-update {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</body>
